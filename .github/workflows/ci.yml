name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build and test
        id: maven
        shell: bash
        run: |
          set +e
          mvn --batch-mode --no-transfer-progress clean verify > maven-build.log 2>&1
          status=$?
          cat maven-build.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload Maven diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: maven-build-log
          path: maven-build.log
          if-no-files-found: error
          retention-days: 7

      - name: Enforce build result
        if: steps.maven.outputs.status != '0'
        run: exit 1
